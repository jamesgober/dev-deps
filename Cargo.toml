[package]
name = "dev-deps"
version = "0.9.2"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Dependency hygiene for Rust crates. Detect unused, outdated, and many-major-versions-behind dependencies. Wraps cargo-udeps + cargo-outdated. Part of the dev-* verification collection."

keywords = [
    "dependencies",
    "outdated",
    "unused",
    "udeps",
    "ci"
]

categories = [
    "development-tools",
    "development-tools::testing",
    "development-tools::cargo-plugins"
]

documentation = "https://docs.rs/dev-deps"
repository = "https://github.com/jamesgober/dev-deps"
homepage = "https://github.com/jamesgober/dev-deps"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dev-report = { version = "0.9", path = "../dev-report" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
